# Nebula Forge IDE：移动端稳定构建配置
# 禁用 Gradle Build Cache，避免部分 Android/移动端文件系统对缓存归档树写入不兼容。
org.gradle.caching=false
# 移动端降低并发，减少 Gradle/Kotlin daemon 被系统回收的概率。
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
# Kotlin 编译改为进程内执行，避免 Kotlin compile daemon 单独启动后被系统终止。
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk

# proot 适配：禁用文件锁监听与守护进程通信
org.gradle.daemon=false
org.gradle.vfs.watch=false
org.gradle.unsafe.watch-fs=false

org.gradle.daemon.idletimeout=0
org.gradle.configureondemand=false
org.gradle.internal.launcher.welcomeMessageEnabled=false
org.gradle.native=false